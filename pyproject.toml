[project]
name = "merx"
version = "0.1.0"
description = "A commodities data operations platform: declarative dataset contracts run by one engine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "dagster>=1.13,<1.14",
    "duckdb>=1.5",
    "pyarrow>=26",
    "pydantic>=2.14",
    "pyyaml>=6",
    "xlrd>=2.0",
    "fastapi>=0.143",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver>=1.13,<1.14",
    "httpx>=0.28",
    "pytest>=8",
    "ruff>=0.14",
    "xlwt>=1.3",
]

[project.scripts]
merx = "merx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/merx"]

# `dagster dev` (run from the repo root) loads the definitions from here.
[tool.dagster]
module_name = "merx.orchestration.definitions"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
