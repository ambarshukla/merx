# Natural gas held in underground storage in the Lower 48 US states, weekly.
# Each value is for the week ending Friday; EIA publishes it the following Thursday.
# Storage fills from spring to autumn and draws down in winter, so it is the series
# the seasonal detector is built for.
id: eia_us_gas_storage
title: US Lower 48 natural gas working storage, weekly
domain: gas
owner: gas-data-steward
tier: 1
frequency: weekly
instrument: US_L48_GAS_STORAGE
unit: Bcf
source:
  provider: eia
  format: eia_hist_xls
  url: https://www.eia.gov/dnav/ng/hist_xls/NW2_EPG0_SWO_R48_BCFw.xls
  series_key: NW2_EPG0_SWO_R48_BCF
schedule:
  cron: "0 12 * * 4"
  timezone: America/New_York
checks:
  - {type: not_null, column: value}
  - {type: unique, columns: [valid_date]}
  - {type: range, column: value, min: 0, max: 5000}
  - {type: freshness, max_age_days: 14}
