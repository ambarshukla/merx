# Brent crude oil spot price: the main international crude benchmark.
id: eia_brent_spot
title: Brent crude oil spot price, Europe, daily
domain: oil
owner: oil-data-steward
tier: 1
frequency: daily
instrument: BRENT_SPOT
unit: USD/bbl
measures: [price]
source:
  provider: eia
  format: eia_hist_xls
  url: https://www.eia.gov/dnav/pet/hist_xls/RBRTEd.xls
  series_key: RBRTE
  # Backfill history from dated copies in the Wayback Machine (probed 2026-10-16).
  archive_backfill: true
schedule:
  cron: "30 18 * * 1-5"
  timezone: America/New_York
# Compare every value with the same series from EIA's API (D-012).
reconcile_with: {dataset: eia_api_brent_spot}
checks:
  - {type: not_null, column: value}
  - {type: unique, columns: [measure, valid_date]}
  # Brent has never printed below zero; a negative value here would be a defect.
  - {type: range, column: value, min: 0, max: 300}
  - {type: freshness, max_age_days: 10}
  - {type: no_withdrawals}
