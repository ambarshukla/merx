# WTI crude oil spot price at Cushing, Oklahoma: the main US crude benchmark.
id: eia_wti_spot
title: WTI crude oil spot price, Cushing, daily
domain: oil
owner: oil-data-steward
tier: 1
frequency: daily
instrument: WTI_CUSHING_SPOT
unit: USD/bbl
measures: [price]
source:
  provider: eia
  format: eia_hist_xls
  url: https://www.eia.gov/dnav/pet/hist_xls/RWTCd.xls
  series_key: RWTC
  # Backfill history from dated copies in the Wayback Machine (probed 2026-10-15).
  archive_backfill: true
schedule:
  cron: "30 18 * * 1-5"
  timezone: America/New_York
checks:
  - {type: not_null, column: value}
  - {type: unique, columns: [measure, valid_date]}
  # Negative prices are real: WTI spot printed -36.98 on 2020-04-20. The floor is a
  # plausibility bound, not zero.
  - {type: range, column: value, min: -100, max: 300}
  # EIA refreshes this file about weekly, so the newest value can be several days old.
  - {type: freshness, max_age_days: 10}
