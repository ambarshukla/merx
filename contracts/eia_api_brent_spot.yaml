# Brent crude oil spot price, through EIA's API (v2): the same series as
# eia_brent_spot, through a second channel. Added 2026-10-16 after a count showed
# the API holding 9,993 daily values against the spreadsheet's 9,108.
id: eia_api_brent_spot
title: Brent crude oil spot price, Europe, daily (EIA API)
domain: oil
owner: oil-data-steward
tier: 2
frequency: daily
instrument: BRENT_SPOT
unit: USD/bbl
measures: [price]
source:
  provider: eia
  format: eia_api_v2
  url: https://api.eia.gov/v2/petroleum/pri/spt/data/
  series_key: RBRTE
  # The key is read from this environment variable (set in .env); it is never stored.
  api_key_env: EIA_API_KEY
schedule:
  cron: "30 18 * * 1-5"
  timezone: America/New_York
in_quality_lab: false
checks:
  - {type: not_null, column: value}
  - {type: unique, columns: [measure, valid_date]}
  - {type: range, column: value, min: 0, max: 300}
  - {type: freshness, max_age_days: 10}
  - {type: no_withdrawals}
  # The lab's recommended detector for this series (docs/DQ_LAB.md); warning only.
  - {type: anomaly, detector: seasonal_suite}
